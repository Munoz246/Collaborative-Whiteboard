<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | Collaborative Whiteboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="dashboard-page">
  <main class="dashboard-layout" aria-label="Whiteboards dashboard">
    <header class="dashboard-header">
      <div class="dashboard-title-pill">
        <h1 class="dashboard-title">Your Whiteboards</h1>
      </div>
      <div class="dashboard-header-actions" aria-label="User actions">
        <button type="button" class="dashboard-icon-btn" aria-label="Profile">
          <svg class="dashboard-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
        </button>
        <button type="button" class="dashboard-icon-btn" aria-label="Settings">
          <svg class="dashboard-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
          </svg>
        </button>
      </div>
    </header>

    <section class="dashboard-cta-row" aria-label="Primary whiteboard actions">
      <button type="button" class="dashboard-cta-btn">Create Whiteboard</button>
      <button type="button" class="dashboard-cta-btn">Join Whiteboard</button>
    </section>

    <section class="dashboard-board-list" aria-label="Whiteboard list">
      <article class="dashboard-board-card">
        <div class="dashboard-board-thumb" aria-hidden="true"></div>
        <h2 class="dashboard-board-title">Title of the whiteboard</h2>
        <div class="dashboard-owner">
          <span class="dashboard-owner-avatar" aria-hidden="true"></span>
          <span class="dashboard-owner-name">Owner's name</span>
        </div>
        <button type="button" class="dashboard-menu-btn" aria-label="Open whiteboard menu">
          <svg class="dashboard-menu-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <circle cx="12" cy="5" r="1.8" />
            <circle cx="12" cy="12" r="1.8" />
            <circle cx="12" cy="19" r="1.8" />
          </svg>
        </button>
      </article>

      <article class="dashboard-board-card">
        <div class="dashboard-board-thumb" aria-hidden="true"></div>
        <h2 class="dashboard-board-title">Title of the whiteboard</h2>
        <div class="dashboard-owner">
          <span class="dashboard-owner-avatar" aria-hidden="true"></span>
          <span class="dashboard-owner-name">Owner's name</span>
        </div>
        <button type="button" class="dashboard-menu-btn" aria-label="Open whiteboard menu">
          <svg class="dashboard-menu-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <circle cx="12" cy="5" r="1.8" />
            <circle cx="12" cy="12" r="1.8" />
            <circle cx="12" cy="19" r="1.8" />
          </svg>
        </button>
      </article>

      <article class="dashboard-board-card">
        <div class="dashboard-board-thumb" aria-hidden="true"></div>
        <h2 class="dashboard-board-title">Title of the whiteboard</h2>
        <div class="dashboard-owner">
          <span class="dashboard-owner-avatar" aria-hidden="true"></span>
          <span class="dashboard-owner-name">Owner's name</span>
        </div>
        <button type="button" class="dashboard-menu-btn" aria-label="Open whiteboard menu">
          <svg class="dashboard-menu-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <circle cx="12" cy="5" r="1.8" />
            <circle cx="12" cy="12" r="1.8" />
            <circle cx="12" cy="19" r="1.8" />
          </svg>
        </button>
      </article>
    </section>
  </main>
</body>
</html>
